[tool.poetry]
name = "netagentbench-agent-harness"
version = "0.1.0"
description = "Minimal HTTP agent harness for NetAgentBench multi-turn evaluation (trimmed from dagent)."
authors = [
    "Ahmed Twabi",
    "Yepeng Ding",
    "Tohru Kondo",
]
readme = "README.md"
license = "Apache-2.0"
packages = [{ include = "dagent" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.115.8,<0.116.0"
uvicorn = { version = ">=0.34.0,<0.35.0", extras = ["standard"] }
pydantic = "^2.7.0"
autogen-core = "0.5.6"
autogen-agentchat = ">=0.5.6,<0.6.0"
autogen-ext = { version = ">=0.5.6,<0.6.0", extras = ["openai", "anthropic", "ollama"] }
openai = ">=1.75.0,<2.0.0"
mcp = ">=1.2.0"
ollama = ">=0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^1.3.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

