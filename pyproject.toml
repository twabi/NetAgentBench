[tool.poetry]
name = "network-config-benchmark"
version = "0.1.0"
description = "Formal verification system for network configuration evaluation using FSM theory"
authors = [
    "Ahmed Twabi",
    "Yepeng Ding",
    "Tohru Kondo",
]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "benchmark", from = "src"}]
keywords = ["network", "configuration", "benchmark", "fsm", "containerlab", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0"
pyyaml = "^6.0"
docker = "^7.0.0"
jsonpath-ng = "^1.6.0"
openai = "^1.0.0"
anthropic = "^0.25.0"
google-generativeai = "^0.8.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.0"
click = "^8.1.0"
scipy = "^1.11.0"
matplotlib = "^3.10.7"
psutil = "^7.2.1"
# MCP server dependencies
mcp = "^1.23.0"
fastapi = "^0.115.0"
uvicorn = "^0.31.1"
starlette = "^0.40.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
mypy = "^1.5.0"
ruff = "^0.1.0"
black = "^26.3.1"

[tool.poetry.scripts]
benchmark = "benchmark.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "integration: marks tests as integration tests (slow, require containerlab)",
    "unit: marks tests as unit tests (fast, no external dependencies)",
    "slow: marks tests as slow (> 1 minute, uses real infrastructure heavily)",
    "performance: marks tests as performance benchmarks",
    "stress: marks tests as stress tests (high resource usage)",
    "manual: marks tests as manual (requires API keys or human interaction)",
    "llm: marks tests as LLM integration tests (requires LLM API access)",
]

[tool.coverage.run]
source = ["src/benchmark"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "docker.*",
    "jsonpath_ng.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # unused imports in __init__.py

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

